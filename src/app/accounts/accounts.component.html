<div class="container">
  <div class="row mt-5">
    <div class="col-12 col-md-6 mt-4">
      <div class="card">
        <div class="card-header">Accounts</div>
        <div class="card-body">
          <form [formGroup]="accountFormGroup" (ngSubmit)="handleSearchAccount()">
            <div class="input-group">
              <label class="input-group-text" for="accountId">Account Id:</label>
              <input id="accountId" type="text" formControlName="accountId" class="form-control">
              <button type="submit" class="btn btn-info">
                <i class="bi bi-search"></i> Search
              </button>
            </div>
          </form>

          <ng-template #failureOrLoading>
            <ng-container *ngIf="errorMessage;else loading">
              <div class="text-danger">
                {{errorMessage}}
              </div>
            </ng-container>
            <ng-template #loading>
              <div *ngIf="isSearchBtnClicked">
                Loading...
              </div>
            </ng-template>
          </ng-template>

          <ng-container *ngIf="account$|async as accountDetails;else failureOrLoading" >

            <div class="mb-2">
              <label >Account ID:</label>
              <label ><strong>{{accountDetails.accountId}}</strong></label>
            </div>

            <div class="mb-2">
              <label >Balance:</label>
              <label ><strong>{{accountDetails.balance |number:'1.2-2'}}</strong></label>
            </div>

            <table class="table">
              <th>ID</th>
              <th>Date</th>
              <th>Type</th>
              <th>Amount</th>
              <th>Description</th>
              <tbody>
                <tr *ngFor="let op of accountDetails.accountOperationDTOS">
                  <td>{{op.id}}</td>
                  <td>{{op.operationDate|date:'dd-MM-yyyy:HH-mm-ss'}}</td>
                  <td>{{op.type}}</td>
                  <td class="text-end">{{op.amount|number:'1.2-2'}}</td>
                  <td>{{op.description}}</td>
                </tr>
              </tbody>
            </table>
            <ul class="nav nav-pills">
              <li *ngFor="let item of [].constructor(accountDetails.totalPages);let page=index">
                <a [ngClass]="page==currentPage?'btn btn-info':'btn btn-outline-info'" class="ms-1 mt-1" (click)="goToPage(page)">{{page}}</a>
              </li>
            </ul>
          </ng-container>

        </div>
      </div>
    </div>

    <div class="col-12 col-md-6 mt-4">
      <div class="card" *ngIf="account$|async ">
        <div class="card-header">Operations</div>
        <div class="card-body">
          <form [formGroup]="operationFormGroup" (ngSubmit)="handleAccountOperation()" method="post" *ngIf="authService.roles.includes('ADMIN')">

            <div class="form-check form-check-inline">
              <input class="form-check-input" type="radio" formControlName="operationType" value="DEBIT">
              <label class="form-check-label">DEBIT:</label>
            </div>

            <div class="form-check form-check-inline">
              <input class="form-check-input" type="radio" formControlName="operationType" value="CREDIT">
              <label class="form-check-label">CREDIT:</label>
            </div>

            <div class="form-check form-check-inline">
              <input class="form-check-input" type="radio" formControlName="operationType" value="TRANSFER">
              <label class="form-check-label">TRANSFER:</label>
            </div>

            <div class="mb-3" *ngIf="operationFormGroup.value.operationType == 'TRANSFER'">
              <label class="form-label">Destination:</label>
              <input type="text" class="form-control" formControlName="accountDestination">
            </div>

            <div class="mb-3">
              <label class="form-label">Amount:</label>
              <input type="text" class="form-control" formControlName="amount">
            </div>

            <div class="mb-3">
              <label class="form-label">Description:</label>
              <input type="text" class="form-control" formControlName="description">
            </div>

            <div class="d-grid mb-3">
              <button class="btn btn-success"> Save Operation</button>
            </div>
          </form>
        </div>
      </div>
    </div>

  </div>
</div>
