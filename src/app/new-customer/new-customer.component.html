<div class="container mt-5">
  <div class="card col-md-6 offset-3 mt-2">
    <div class="card-header">New Customer</div>
    <div class="card-body">
      <form [formGroup]="newCustomerFormGroup" (ngSubmit)="handleSaveCustomer()">
        <div class="mb-3">
          <label for="name" class="form-label">Name</label>
          <input type="text" class="form-control" id="name" formControlName="name">
          <span class="text-danger"
              *ngIf="newCustomerFormGroup.controls['name'].touched
              &&newCustomerFormGroup.controls['name'].errors
              &&newCustomerFormGroup.controls['name'].errors!['required']
                  "
          >
            Name is required
          </span>
        </div>
        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input type="text" class="form-control" id="email" formControlName="email">
          <span class="text-danger"
                *ngIf="newCustomerFormGroup.controls['email'].touched
              &&newCustomerFormGroup.controls['email'].errors
              &&newCustomerFormGroup.controls['email'].errors!['email']
                  "
          >
            Email is not valid
          </span>
        </div>
        <button class="btn btn-info" [disabled]="!newCustomerFormGroup.valid"  type="submit">Save</button>
      </form>
    </div>
  </div>
</div>
