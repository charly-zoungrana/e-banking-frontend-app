<div class="container mt-2">
  <ng-container *ngIf="customers$|async as listCustomers;else failureOrLoading">
    <div class="card" *ngIf="listCustomers.length > 0">
      <div class="card-header">Customers</div>
      <div class="card-body">
        <form [formGroup]="searchFormGroup" (ngSubmit)="handleSearchCustomer()">
          <div class="input-group">
            <label for="keyword" class="input-group-text">Keyword:</label>
            <input type="text" class="form-control" id="keyword" formControlName="keyword">
            <button class="btn btn-info" type="submit">
              <i class="bi bi-search"></i>
            </button>
          </div>
        </form>
        <table class="table">
          <thead>
          <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
          </tr>
          </thead>
          <tbody>
          <tr *ngFor="let customer of listCustomers">
            <td>{{customer.id}}</td>
            <td>{{customer.name}}</td>
            <td>{{customer.email}}</td>
            <td>
              <button class="btn btn-danger" (click)="handleDeleteCustomer(customer.id)">
                <i class="bi bi-trash"></i>
              </button>
            </td>
            <td>
              <button class="btn btn-success" (click)="handleCustomerAccounts(customer)">
                Accounts
              </button>
            </td>
          </tr>
          </tbody>
        </table>
      </div>
    </div>
  </ng-container>
  <ng-template #failureOrLoading>
    <ng-container *ngIf="errorMessage; else loading">
      <div class="text-danger">
        {{errorMessage}}
      </div>
    </ng-container>
    <ng-template #loading>
      Loading...
    </ng-template>
  </ng-template>
</div>
